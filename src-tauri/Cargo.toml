[package]
name = "passwordms"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PasswordMS 应用外壳（Tauri 2，桌面 + Android 共用）"

# 库名与 tauri.conf.json 的 productName 解耦，供 main.rs 引用
#
# crate-type 说明（重要，改动前先读完）：
#   - rlib      : 桌面二进制 `main.rs` 通过它链接本库（桌面构建必需）
#   - staticlib : 静态库产物，供外部/移动端链接
#   - cdylib    : **移动端（Android / iOS）必需**，用于产出 .so / .dylib；
#                 桌面目标下也会生成，但桌面 exe 实际经 rlib 链接，不依赖其导出表。
#
# 历史坑（已解决）：windows-gnu / windows-gnullvm 下生成 DLL 导出表时，GNU 版 ld
#   默认开启 `--export-all-symbols`，会把整棵依赖树的全局符号全部导出，超过 PE 导出上限：
#   rust-lld: error: too many exported symbols (got 120869, max 65535)
# 现已在 `build.rs` 中**按目标**（仅 x86_64-pc-windows-gnullvm）注入
#   `-C link-arg=--exclude-all-symbols` 关闭该默认行为，使「桌面 + Android」
#   可长期共存，无需在移动端打包前后临时增删 cdylib。
[lib]
name = "passwordms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
passwordms-core = { path = "../crates/passwordms-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
zeroize.workspace = true

# 系统集成（v1.4.10）：托盘常驻、全局热键、开机自启。
#
# 两个插件都**只在 Rust 侧调用**，不给前端 JS 包（`@tauri-apps/plugin-*` 一律不装）：
#   · 热键必须在后端注册——前端注册要求窗口先加载完成，冷启动时按热键会没反应；
#     且键位要写进 `prefs.json` 由后端读，走 JS 侧就得两处维护同一份字符串。
#   · 自启是同一次点击里的「写注册表 + 落配置」原子动作，前端只发一条命令。
# 好处：`capabilities/default.json` 无需新增任何插件权限 —— 前端根本无法直接调它们。
#
# ⚠️ **必须是 target 条件依赖，不能放 [dependencies]**（2026-10-29 实测）：
# 放进公共依赖后 `cargo check --target aarch64-linux-android` 直接炸 17 个错误
# （`tauri::menu` / `tauri::tray` 在移动端不存在，两个插件也没有移动端实现）。
# 系统集成本来就是桌面专属功能，Android 上连设置卡都不渲染（靠 DTO 的 `supported` 字段）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

# 生物识别快速解锁的 Windows 适配器（`docs/08-biometric-unlock.md` §5 / §6.1）。
#
# **只在 `cfg(windows)` 下引入**：Android 走 Kotlin 插件（P3），不新增 Rust 依赖。
# 版本与 tauri 依赖树里已有的 `windows 0.62.2` 对齐——这里只是**打开特性**，不引入新包。
#   - `Win32_Security_Cryptography`：DPAPI（`CryptProtectData` / `CryptUnprotectData`）
#   - `Win32_Foundation`：`LocalFree`（DPAPI 输出缓冲必须由它释放）
#   - `Win32_System_Com`：`CoInitializeEx`（WinRT 要求线程先初始化公寓）
#   - `Win32_UI_WindowsAndMessaging`：`PeekMessageW` 等（Hello 对话框需要消息泵）
#   - `Win32_UI_Shell`：`ShellExecuteW`（D-114：唤起「设置 → 账户 → 登录选项」）
#   - `Security_Credentials_UI`：`UserConsentVerifier`（Windows Hello 在场闸门）
# `windows-future` 提供 `IAsyncOperation::join/when`（阻塞/回调等待），已在依赖树中。
[target.'cfg(windows)'.dependencies]
# TPM2 密封器要把 `bind` 摘要附在明文尾部（CNG 没有 AAD 概念），所以需要 SHA-256。
# 与 core 同一个 workspace 版本，不引入新的传递依赖。
sha2.workspace = true
windows = { version = "0.62", features = [
    # interop 版 Hello 要显式标注 `IAsyncOperation<UserConsentVerificationResult>` 类型。
    "Foundation",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    # 守门测试用 `RtlGetVersion` 判 build（决定 interop 是否该可用）。
    "Win32_System_LibraryLoader",
    # IUserConsentVerifierInterop / RoGetActivationFactory：Windows 11 22000+ 才有，
    # 用来把 Hello 对话框挂到应用主窗口上（§34）。
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Security_Credentials_UI",
] }
windows-future = "0.3"
