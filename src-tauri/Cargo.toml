[package]
name = "passwordms"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PasswordMS 应用外壳（Tauri 2，桌面 + Android 共用）"

# 库名与 tauri.conf.json 的 productName 解耦，供 main.rs 引用
#
# crate-type 说明（重要，改动前先读完）：
#   - rlib      : 桌面二进制 `main.rs` 通过它链接本库（桌面构建必需）
#   - staticlib : 静态库产物，供外部/移动端链接
#   - cdylib    : **仅移动端（Android / iOS）需要**，用于产出 .so / .dylib
#
# 这里在非移动目标上刻意**不含 cdylib**：windows-gnu / windows-gnullvm 下为
# 本 crate 生成 dll 导出表时，会因 Tauri 依赖树过大而超出 PE 导出上限——
#   rust-lld: error: too many exported symbols (got 69529, max 65535)
# 桌面构建完全不需要 cdylib。
#
# ⚠️ 将来做 Android 构建时，请为 aarch64-linux-android 目标恢复 cdylib，
#    例如临时改回 ["staticlib", "cdylib", "rlib"] 再执行移动端打包。
[lib]
name = "passwordms_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
passwordms-core = { path = "../crates/passwordms-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
zeroize.workspace = true
