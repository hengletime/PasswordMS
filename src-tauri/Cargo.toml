[package]
name = "passwordms"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PasswordMS 应用外壳（Tauri 2，桌面 + Android 共用）"

# 库名与 tauri.conf.json 的 productName 解耦，供 main.rs 引用
#
# crate-type 说明（重要，改动前先读完）：
#   - rlib      : 桌面二进制 `main.rs` 通过它链接本库（桌面构建必需）
#   - staticlib : 静态库产物，供外部/移动端链接
#   - cdylib    : **移动端（Android / iOS）必需**，用于产出 .so / .dylib；
#                 桌面目标下也会生成，但桌面 exe 实际经 rlib 链接，不依赖其导出表。
#
# 历史坑（已解决）：windows-gnu / windows-gnullvm 下生成 DLL 导出表时，GNU 版 ld
#   默认开启 `--export-all-symbols`，会把整棵依赖树的全局符号全部导出，超过 PE 导出上限：
#   rust-lld: error: too many exported symbols (got 120869, max 65535)
# 现已在 `build.rs` 中**按目标**（仅 x86_64-pc-windows-gnullvm）注入
#   `-C link-arg=--exclude-all-symbols` 关闭该默认行为，使「桌面 + Android」
#   可长期共存，无需在移动端打包前后临时增删 cdylib。
[lib]
name = "passwordms_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
passwordms-core = { path = "../crates/passwordms-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
base64.workspace = true
zeroize.workspace = true

# 生物识别快速解锁的 Windows 适配器（`docs/08-biometric-unlock.md` §5 / §6.1）。
#
# **只在 `cfg(windows)` 下引入**：Android 走 Kotlin 插件（P3），不新增 Rust 依赖。
# 版本与 tauri 依赖树里已有的 `windows 0.62.2` 对齐——这里只是**打开特性**，不引入新包。
#   - `Win32_Security_Cryptography`：DPAPI（`CryptProtectData` / `CryptUnprotectData`）
#   - `Win32_Foundation`：`LocalFree`（DPAPI 输出缓冲必须由它释放）
#   - `Win32_System_Com`：`CoInitializeEx`（WinRT 要求线程先初始化公寓）
#   - `Win32_UI_WindowsAndMessaging`：`PeekMessageW` 等（Hello 对话框需要消息泵）
#   - `Win32_UI_Shell`：`ShellExecuteW`（D-114：唤起「设置 → 账户 → 登录选项」）
#   - `Security_Credentials_UI`：`UserConsentVerifier`（Windows Hello 在场闸门）
# `windows-future` 提供 `IAsyncOperation::join/when`（阻塞/回调等待），已在依赖树中。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Security_Credentials_UI",
] }
windows-future = "0.3"
